name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write          # required for OIDC trusted publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish   # must match the trusted-publisher config on npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest    # ensure npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm publish                  # tokenless via OIDC; publishConfig.provenance:true signs it
